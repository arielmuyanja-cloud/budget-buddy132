
<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>

</style></head><body><div class="box"><h2>💰 Create your Budget Buddy account</h2><p class="text-secondary">Track your business finances from one dashboard.</p><form method="post"><input class="form-control mb-2" name="first_name" placeholder="First name" required><input class="form-control mb-2" name="last_name" placeholder="Last name" required><input class="form-control mb-2" type="email" name="email" placeholder="Email" required><input class="form-control mb-2" name="username" placeholder="Username" required><input class="form-control mb-2" type="password" name="password" placeholder="Password (8+ characters)" required><select class="form-select mb-3" name="profile_type"><option value="general">General</option><option value="professional">Professional</option><option value="student">Student</option></select><button class="btn btn-success">Create account</button></form><p class="mt-3">Already have an account? <a href="/login">Log in</a></p></div></body></html>

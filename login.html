
<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>
body{background:#0b1220;color:#eef2ff;font-family:system-ui;padding:40px 16px}.box{max-width:430px;margin:50px auto;background:#121c2e;border:1px solid #26344d;border-radius:16px;padding:30px}.form-control,.form-select{background:#0b1220;color:#fff;border-color:#334155}.btn{width:100%}a{color:#60a5fa}
</style></head><body><div class="box"><h2>🔐 Log in</h2><form method="post"><input class="form-control mb-2" name="identifier" placeholder="Email or username" required><input class="form-control mb-3" type="password" name="password" placeholder="Password" required><button class="btn btn-success">Log in</button></form><p class="mt-3"><a href="/forgot-password">Forgot password?</a></p><p>No account? <a href="/register">Create one</a></p>{% if session.get('dev_verify_link') %}<div class="alert alert-warning mt-3">Development verification link:<br><a href="{{ session.pop('dev_verify_link') }}">{{ session.get('dev_verify_link','') }}</a></div>{% endif %}</div></body></html>


<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot password</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>
body{background:#0b1220;color:#eef2ff;font-family:system-ui;padding:40px 16px}.box{max-width:430px;margin:50px auto;background:#121c2e;border:1px solid #26344d;border-radius:16px;padding:30px}.form-control,.form-select{background:#0b1220;color:#fff;border-color:#334155}.btn{width:100%}a{color:#60a5fa}
</style></head><body><div class="box"><h2>Reset password</h2><p class="text-secondary">Enter your email. If it exists, we'll create a reset link.</p><form method="post"><input class="form-control mb-3" type="email" name="email" required><button class="btn btn-success">Send reset link</button></form>{% if session.get('dev_reset_link') %}<div class="alert alert-warning mt-3">Development reset link:<br><a href="{{ session.pop('dev_reset_link') }}">{{ session.get('dev_reset_link','') }}</a></div>{% endif %}<p class="mt-3"><a href="/login">Back to login</a></p></div></body></html>

{% extends "base.html" %}
{% block title %}Profile | Budget Buddy{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card p-4 shadow-lg">
                <h3 class="fw-bold mb-4">Your Profile</h3>
                
                <form method="POST" action="{{ url_for('profile') }}">
                    <!-- Agency Name (Pre-filled & Editable) -->
                    <div class="mb-3">
                        <label for="agency_name" class="form-label small text-secondary">Agency / Business Name</label>
                        <input 
                            type="text" 
                            id="agency_name" 
                            name="agency_name" 
                            class="form-control" 
                            placeholder="e.g. Acme Media LLC" 
                            value="{{ user.agency_name if user.agency_name else '' }}" 
                            required
                        >
                    </div>

                    <!-- Email Address (Disabled Display) -->
                    <div class="mb-3">
                        <label for="email" class="form-label small text-secondary">Email Address</label>
                        <input 
                            type="email" 
                            id="email" 
                            class="form-control" 
                            value="{{ user.email }}" 
                            disabled
                        >
                    </div>

                    <!-- New Password (Optional) -->
                    <div class="mb-4">
                        <label for="password" class="form-label small text-secondary">Change Password (leave blank to keep current)</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-control" 
                            placeholder="••••••••"
                        >
                    </div>

                    <button type="submit" class="btn btn-primary w-100 fw-bold">Save Profile</button>
                </form>

                <hr class="my-4" style="border-color: #334155;">

                <div class="d-flex justify-content-between align-items-center">
                    <span class="text-secondary">Current Subscription:</span>
                    <span class="badge bg-warning text-dark px-3 py-2 fw-bold">{{ user.plan_tier }}</span>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

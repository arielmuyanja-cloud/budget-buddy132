<!DOCTYPE html>

<html>

<head>

<title>
StackGuard SaaS Leak Audit
</title>


<style>

body{

background:#0f172a;
color:white;
font-family:Arial;
padding:40px;

}


.container{

max-width:700px;
margin:auto;
text-align:center;

}


.card{

background:#1e293b;
padding:30px;
border-radius:12px;

}


input{

width:100%;
padding:15px;
margin:10px 0;

background:#0f172a;
color:white;

border:1px solid #334155;

border-radius:8px;

}



button{

width:100%;
padding:16px;

background:#22c55e;

border:none;

border-radius:8px;

font-size:18px;

font-weight:bold;

cursor:pointer;

}


</style>


</head>



<body>


<div class="container">


<h1>
Find Your Agency's Hidden SaaS Waste
</h1>


<p>
Upload your software statements and discover $1,000+ in possible savings.
</p>



<div class="card">


<form action="/upload-statements"
method="POST"
enctype="multipart/form-data">


<input
type="text"
name="agency_name"
placeholder="Agency Name"
required>



<input
type="email"
name="email"
placeholder="Work Email"
required>



<input
type="file"
name="statements"
multiple
accept=".csv"
required>



<button>

Run Free Audit

</button>


</form>


<p>

Free users:
3 CSV files max

<br>

Paid users:
50 CSV files

</p>


</div>


</div>



</body>

</html>

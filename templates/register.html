{% extends "base.html" %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card p-4 shadow-lg">
                <h3 class="fw-bold text-center mb-3">Create Free Account</h3>
                <form action="{{ url_for('register') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label small text-secondary">Agency / Business Name</label>
                        <input type="text" name="agency_name" class="form-control" placeholder="Apex Media" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small text-secondary">Work Email</label>
                        <input type="email" name="email" class="form-control" placeholder="owner@agency.com" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small text-secondary">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                    <div class="mb-4 form-check">
                        <input type="checkbox" class="form-check-input" id="agreeTerms" name="agree_terms" required>
                        <label class="form-check-label small text-secondary" for="agreeTerms">I've read and agree to the <a href="{{ url_for('terms') }}" target="_blank" rel="noopener">Terms and Conditions</a></label>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold">Register Account</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}


{% extends "base.html" %}{% block title %}Profile | Budget Buddy{% endblock %}{% block content %}<div class="row justify-content-center"><div class="col-lg-6"><div class="card p-4"><h3>Your profile</h3><form method="post"><input class="form-control mb-3" name="first_name" value="{{ user['first_name'] }}" required><input class="form-control mb-3" name="last_name" value="{{ user['last_name'] }}" required><input class="form-control mb-3" value="{{ user['email'] }}" disabled><input class="form-control mb-3" value="{{ user['username'] }}" disabled><button class="btn btn-success">Save profile</button></form><hr><p class="text-muted mb-0">Plan: <strong>{{ user['tier'] }}</strong></p></div></div></div>{% endblock %}

{% extends "base.html" %}

{% block content %}
<div class="container my-5">
    <h2>SaaS Leak Audit Statement Scanner</h2>
    <p class="text-muted">Upload your monthly bank or credit card statements (CSV) to run an automated leak scan.</p>
    
    <div class="card p-4 shadow-sm">
        <form id="uploadForm" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="statements" class="form-label">Select CSV Bank Statements</label>
                <input class="form-control" type="file" id="statements" name="statements" multiple accept=".csv">
                <div class="form-text">Free tier allows up to 3 files. Paid accounts can upload up to 50 statements at once.</div>
            </div>
            <button type="submit" class="btn btn-primary">Run SaaS Leak Audit</button>
        </form>
    </div>

    <!-- Response Display Section -->
    <div id="resultBox" class="mt-4" style="display: none;"></div>
</div>

<script>
document.getElementById('uploadForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const resultBox = document.getElementById('resultBox');
    resultBox.style.display = 'block';
    resultBox.innerHTML = '<div class="alert alert-info">Processing statements...</div>';

    const formData = new FormData();
    const fileInput = document.getElementById('statements');
    
    for (let i = 0; i < fileInput.files.length; i++) {
        formData.append('statements', fileInput.files[i]);
    }

    try {
        const response = await fetch('/upload-statements', {
            method: 'POST',
            body: formData
        });

        const data = await response.json();

        if (!response.ok) {
            resultBox.innerHTML = `
                <div class="alert alert-danger">
                    <strong>Error:</strong> ${data.message || data.error}
                    ${data.upgrade_required ? '<br><a href="/pricing" class="btn btn-sm btn-warning mt-2">Upgrade to Paid Tier ($600)</a>' : ''}
                </div>`;
            return;
        }

        if (data.tier === 'FREE') {
            resultBox.innerHTML = `
                <div class="alert alert-warning">
                    <h4>Teaser Scan Results (${data.processed_count} files scanned)</h4>
                    <p><strong>Estimated Annual SaaS Leak:</strong> ${data.teaser_summary.estimated_savings}</p>
                    <p>${data.message}</p>
                    <a href="/pricing" class="btn btn-success">Unlock Full 50-Statement Bulk Scan ($600)</a>
                </div>`;
        } else {
            resultBox.innerHTML = `
                <div class="alert alert-success">
                    <h4>Full Audit Initiated</h4>
                    <p>${data.message}</p>
                    <p>Successfully uploaded ${data.processed_count} statements for processing.</p>
                </div>`;
        }
    } catch (err) {
        resultBox.innerHTML = '<div class="alert alert-danger">An unexpected error occurred during upload.</div>';
    }
});
</script>
{% endblock %}
